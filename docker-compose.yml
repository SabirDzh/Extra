services:
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  pg:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  maildev:
    image: maildev/maildev
    environment:
      - TZ=Europe/Moscow
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
    ports:
      - "1080:1080"
      - "1025:1025"
    logging:
      driver: "json-file"
      options:
        max-size: "1m"

  # пока не трогать, скрипт по использованию крон в readme.md
  cleanup-cron:
    image: postgres:14-alpine
    depends_on:
      - pg
    volumes:
      - ./cleanup_access_tokens.sql:/cleanup.sql
    command: >
      bash -c "
      echo '*/5 * * * * psql $DATABASE_URL -f /cleanup.sql' | crontab - &&
      crond -f
      "
    environment:
      DATABASE_URL: postgresql://user:password@pg-1:5432/shop
