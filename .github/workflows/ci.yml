name: CI

on:
  pull_request:
  push:

jobs:
  tests:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    env:
      WEBHOOK_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Verify dependency lock
        run: poetry check --lock

      - name: Check newly added Python files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            PYTHON_FILES=$(git ls-files --others --exclude-standard -- '*.py')
          else
            PYTHON_FILES=$(git diff --name-only --diff-filter=A "$BASE_SHA" "$GITHUB_SHA" -- '*.py')
          fi

          if [ -n "$PYTHON_FILES" ]; then
            poetry run ruff check $PYTHON_FILES
            poetry run ruff format --check $PYTHON_FILES
          fi

      - name: Compile application
        run: poetry run python -m compileall -q backend

      - name: Run tests
        run: |
          cd backend
          poetry run python -m pytest
